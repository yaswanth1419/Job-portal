<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Welcome, <span id="usernameDisplay"></span></h2>
    <h3>User Dashboard</h3>

    <form id="profileForm">
      <input type="text" id="fullname" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="file" id="resume" accept=".pdf,.doc,.docx" />
      <button type="submit">Save Profile</button>
    </form>

    <h3>Job Applications</h3>
    <ul id="applicationsList">
      <li>Front-End Developer - <strong>Applied</strong></li>
      <li>UI/UX Designer - <strong>Interview Scheduled</strong></li>
    </ul>

    <button onclick="logout()">Logout</button>
  </div>

  <script>
    // Show username
    const username = localStorage.getItem("username");
    const role = localStorage.getItem("role");
    if (role !== "user") window.location.href = "index.html";
    document.getElementById("usernameDisplay").textContent = username;

    // Save profile
    document.getElementById("profileForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Profile saved successfully (simulated)!");
    });

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
